name: Repair weight goal source of truth

on:
  push:
    branches:
      - feat/multi-goal-clean

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-goal-clean
          fetch-depth: 0

      - name: Patch weight-goal logic
        run: |
          python3 <<'PY'
          from pathlib import Path

          service = Path('api/src/modules/health-goals/health-goals.service.ts')
          text = service.read_text()

          old = '''  private async captureWeightGoalBaseline(goalId: string, patientId: string, createdAt: Date, preferCurrentPatientWeight = false) {\n    let baseline: number | null = null;\n    if (preferCurrentPatientWeight) {\n      const patient = await this.prisma.patient.findUnique({ where: { id: patientId }, select: { weightKg: true } });\n      baseline = patient?.weightKg == null ? null : Number(patient.weightKg);\n    }\n    if (baseline == null) {\n      const latest = await this.prisma.$queryRaw<Array<{ loggedValue: Prisma.Decimal }>>`SELECT "loggedValue" FROM "HealthGoalMetricEvent" WHERE "patientId" = ${patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" <> 'goal-baseline' AND "occurredAt" <= ${createdAt} ORDER BY "occurredAt" DESC LIMIT 1`;\n      baseline = latest.length ? Number(latest[0].loggedValue) : null;\n    }\n    if (baseline == null) { const patient = await this.prisma.patient.findUnique({ where: { id: patientId }, select: { weightKg: true } }); baseline = patient?.weightKg == null ? null : Number(patient.weightKg); }\n    if (baseline == null || !Number.isFinite(baseline)) return;\n    await this.prisma.$executeRaw`DELETE FROM "HealthGoalMetricEvent" WHERE "patientId" = ${patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" = 'goal-baseline' AND "sourceId" = ${goalId}`;\n    await this.prisma.$executeRaw`INSERT INTO "HealthGoalMetricEvent" ("id","patientId","metricType","metricKey","loggedValue","occurredAt","source","sourceId") VALUES (gen_random_uuid(),${patientId},'WEIGHT','weight.kg',${baseline},${createdAt},'goal-baseline',${goalId})`;\n  }'''

          new = '''  private async captureWeightGoalBaseline(goalId: string, patientId: string, createdAt: Date) {\n    // The goal baseline is the latest legitimate weight measurement at or before goal creation.\n    // The Patient.weightKg profile value is only a fallback when no historical measurement exists.\n    let baseline: number | null = null;\n    const latest = await this.prisma.$queryRaw<Array<{ loggedValue: Prisma.Decimal }>>`SELECT "loggedValue" FROM "HealthGoalMetricEvent" WHERE "patientId" = ${patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" <> 'goal-baseline' AND "occurredAt" <= ${createdAt} ORDER BY "occurredAt" DESC LIMIT 1`;\n    baseline = latest.length ? Number(latest[0].loggedValue) : null;\n    if (baseline == null) { const patient = await this.prisma.patient.findUnique({ where: { id: patientId }, select: { weightKg: true } }); baseline = patient?.weightKg == null ? null : Number(patient.weightKg); }\n    if (baseline == null || !Number.isFinite(baseline)) return;\n    await this.prisma.$executeRaw`DELETE FROM "HealthGoalMetricEvent" WHERE "patientId" = ${patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" = 'goal-baseline' AND "sourceId" = ${goalId}`;\n    await this.prisma.$executeRaw`INSERT INTO "HealthGoalMetricEvent" ("id","patientId","metricType","metricKey","loggedValue","occurredAt","source","sourceId") VALUES (gen_random_uuid(),${patientId},'WEIGHT','weight.kg',${baseline},${createdAt},'goal-baseline',${goalId})`;\n  }'''

          if old not in text:
              raise SystemExit('Expected baseline function was not found; refusing partial patch.')
          text = text.replace(old, new)

          old = '''  private async ensureOnboardingWeightGoalMetric(goal: any) {\n    if (String(goal?.category ?? '').toUpperCase() !== 'WEIGHT') return goal;\n    const existing = await this.prisma.$queryRaw<Array<{ id: string }>>`SELECT "id" FROM "HealthGoalMetricEvent" WHERE "patientId" = ${goal.patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" = 'goal-baseline' AND "sourceId" = ${goal.id} LIMIT 1`;\n    if (!existing.length) await this.captureWeightGoalBaseline(String(goal.id), String(goal.patientId), new Date(goal.createdAt), false);\n    return goal;\n  }'''
          new = '''  private async ensureOnboardingWeightGoalMetric(goal: any) {\n    if (String(goal?.category ?? '').toUpperCase() !== 'WEIGHT') return goal;\n    // Repair a stale baseline from historical measurements when the goal already exists.\n    await this.captureWeightGoalBaseline(String(goal.id), String(goal.patientId), new Date(goal.createdAt));\n    return goal;\n  }'''
          if old not in text:
              raise SystemExit('Expected baseline repair function was not found; refusing partial patch.')
          text = text.replace(old, new)

          old = '''      await this.captureWeightGoalBaseline(goal.id, String(goalData.patientId), goal.createdAt, true);'''
          new = '''      await this.captureWeightGoalBaseline(goal.id, String(goalData.patientId), goal.createdAt);'''
          if old not in text:
              raise SystemExit('Expected create baseline call was not found; refusing partial patch.')
          text = text.replace(old, new)

          old = '''VALUES (gen_random_uuid(), ${goalId}, ${config.metricType ?? null}, ${config.metricKey ?? null}, ${config.frequency ?? null}, ${config.aggregation ?? null}, ${config.comparison ?? null}, ${config.guidanceText ?? null})`;'''
          new = '''VALUES (gen_random_uuid(), ${goalId}, ${config.metricType ?? null}, ${config.metricKey ?? null}, ${config.frequency ?? null}, ${config.frequencyTarget ?? null}, ${config.aggregation ?? null}, ${config.comparison ?? null}, ${config.guidanceText ?? null})`;'''
          if old not in text:
              raise SystemExit('Expected metric-config INSERT was not found; refusing partial patch.')
          text = text.replace(old, new)
          service.write_text(text)

          page = Path('web/app/health-goals/page.tsx')
          text = page.read_text()
          old = '''      if (draft.weightDirection === "LOSE" && (analysis.underweightNow || analysis.targetBelowHealthy)) {\n        toast.error("This weight-loss target would move you below the adult BMI screening range. Choose a smaller target or a health-focused goal, and consider discussing your weight goal with a healthcare professional.");\n        return;\n      }\n'''
          if old not in text:
              raise SystemExit('Expected BMI blocking block was not found; refusing partial patch.')
          text = text.replace(old, '')
          page.write_text(text)

          workflow = Path('.github/workflows/weight-goal-source-of-truth.yml')
          # The repair is complete; remove this temporary workflow so it cannot keep touching the branch.
          workflow.unlink(missing_ok=True)
          PY

      - name: Commit repaired source of truth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes were required."
            exit 0
          fi
          git add api/src/modules/health-goals/health-goals.service.ts web/app/health-goals/page.tsx .github/workflows/weight-goal-source-of-truth.yml
          git commit -m "fix: make weight goal baseline immutable and advisory"
          git push origin feat/multi-goal-clean

name: Force medication edit fix
on:
  push:
    branches: [feat/multi-goal-clean]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-goal-clean
          fetch-depth: 0
      - name: Apply fetch-before-open hydration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app/medications/page.tsx')
          s = p.read_text()
          start = s.index('  async function openEdit(m: any) {')
          end = s.index('  async function deleteMedication', start)
          new_fn = '''  async function openEdit(medicationCard: any) {
            const targetId = medicationCard?.patientMedicationId || medicationCard?.id;
            if (!targetId) {
              toast.error("Unable to edit this medication.");
              return;
            }
            try {
              setLoadingEdit(true);
              // Fetch the authoritative PatientMedication record before opening the editor.
              const response = await api.get(`/patient-medications/${encodeURIComponent(String(targetId))}`);
              const payload: any = response.data;
              const completeRecord = payload?.data ?? payload;
              if (!completeRecord || typeof completeRecord !== "object") {
                throw new Error("Failed to fetch full medication details");
              }

              // Normalize the complete backend record into the exact wizard schema.
              const fullItem = toItem(completeRecord);
              if (!fullItem?.patientMedicationId) {
                throw new Error("Saved medication record could not be mapped.");
              }

              // Preserve the full master medication reference for MedicationForm.
              const medicationReference = completeRecord?.medication
                || completeRecord?.patientMedication?.medication
                || medicationCard?.medication
                || {
                  id: completeRecord?.medicationId,
                  name: completeRecord?.customName || medicationCard?.name || ""
                };

              const hydratedRecord = {
                ...medicationCard,
                ...completeRecord,
                patientMedicationId: fullItem.patientMedicationId,
                medicationId: fullItem.medicationId,
                medication: medicationReference,
                dosage: fullItem.dosage,
                frequency: fullItem.frequency,
                route: fullItem.route,
                indication: fullItem.indication,
                instructions: fullItem.instructions,
                prescribedBy: fullItem.prescribedBy,
                startedAt: fullItem.startedAt,
                endedAt: fullItem.endedAt,
                ongoing: fullItem.ongoing,
                sideEffects: fullItem.sideEffects,
                effectiveness: fullItem.effectiveness,
                notes: fullItem.notes,
                status: fullItem.status
              };

              setEditingMedicationData(hydratedRecord);
              setValues({ medications: [fullItem] });
              setEditingMedicationId(String(fullItem.patientMedicationId));
              setEditing(true);
              setMedicationStep(1);
              setShowEditor(true);
            } catch (error: any) {
              console.error("Error initializing medication edit flow:", error);
              const msg = error?.response?.data?.message;
              toast.error(Array.isArray(msg) ? msg.join(", ") : msg || "Unable to load the saved medication details.");
            } finally {
              setLoadingEdit(false);
            }
          }
'''
          s = s[:start] + new_fn + s[end:]

          # Make the form react to every hydrated saved field, not only the record id.
          old = '  useEffect(() => { const known = new Set([...PRESCRIBERS, ...INSTRUCTIONS, ...REASONS, ...FALLBACK_SIDE_EFFECTS, ...EFFECTIVENESS.map(([v]) => v)]); const next: Record<string, boolean> = {}; (["prescribedBy", "instructions", "indication", "sideEffects"] as const).forEach(key => { const current = String(value[key] || ""); if (current && !known.has(current)) next[key] = true; }); setCustom(next); }, [value.patientMedicationId]);'
          new = '  useEffect(() => { const known = new Set([...PRESCRIBERS, ...INSTRUCTIONS, ...REASONS, ...FALLBACK_SIDE_EFFECTS, ...EFFECTIVENESS.map(([v]) => v)]); const next: Record<string, boolean> = {}; (["prescribedBy", "instructions", "indication", "sideEffects"] as const).forEach(key => { const current = String(value[key] || ""); if (current && !known.has(current)) next[key] = true; }); setCustom(next); }, [value.patientMedicationId, value.prescribedBy, value.instructions, value.indication, value.sideEffects]);'
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit page and remove both temporary workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/medications/page.tsx
          git rm .github/workflows/force-medication-edit-fix.yml .github/workflows/fix-medication-edit-hydration.yml
          git commit -m 'Implement fetch-before-open medication editing'
          git push origin HEAD:feat/multi-goal-clean

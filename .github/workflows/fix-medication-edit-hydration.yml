name: Fix medication edit hydration
on:
  push:
    branches: [feat/multi-goal-clean]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-goal-clean
          fetch-depth: 0
      - name: Hydrate saved medication into edit form
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('web/app/medications/page.tsx')
          s = p.read_text()
          pattern = r'  useEffect\(\(\) => \{ const name = String\(initialMedicationReference\?\.medication\?\.name \|\| initialMedicationReference\?\.medication\?\.genericName \|\| initialMedicationReference\?\.name \|\| initialMedicationReference\?\.genericName \|\| ""\); if \(!initialMedicationReference\) return; setSearch\(name\); setSelectedName\(name\); setSelectedMedication\(initialMedicationReference\?\.medication \|\| initialMedicationReference\); \}, \[initialMedicationReference\]\);'
          replacement = '''  useEffect(() => {
            const name = String(initialMedicationReference?.medication?.name || initialMedicationReference?.medication?.genericName || initialMedicationReference?.name || initialMedicationReference?.genericName || "");
            if (!initialMedicationReference) return;
            setSearch(name);
            setSelectedName(name);
            setSelectedMedication(initialMedicationReference?.medication || initialMedicationReference);
          }, [initialMedicationReference]);
          useEffect(() => {
            if (!editing || !initialMedicationReference) return;
            const hydrated = toItem(initialMedicationReference);
            if (!hydrated?.patientMedicationId) return;
            const sameId = String(value.patientMedicationId || "") === String(hydrated.patientMedicationId);
            if (sameId) {
              const fields = ["medicationId", "dosage", "frequency", "route", "indication", "instructions", "prescribedBy", "startedAt", "endedAt", "ongoing", "sideEffects", "effectiveness", "notes"] as const;
              const alreadyHydrated = fields.every(key => String((value as any)[key] ?? "") === String((hydrated as any)[key] ?? ""));
              if (alreadyHydrated) return;
            }
            onChange({ ...value, ...hydrated, patientMedicationId: hydrated.patientMedicationId });
          }, [editing, initialMedicationReference?.patientMedicationId, initialMedicationReference?.id]);'''
          s2, n = re.subn(pattern, replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'edit hydration target not found: {n}')
          s = s2
          old = '  useEffect(() => { const known = new Set([...PRESCRIBERS, ...INSTRUCTIONS, ...REASONS, ...FALLBACK_SIDE_EFFECTS, ...EFFECTIVENESS.map(([v]) => v)]); const next: Record<string, boolean> = {}; (["prescribedBy", "instructions", "indication", "sideEffects"] as const).forEach(key => { const current = String(value[key] || ""); if (current && !known.has(current)) next[key] = true; }); setCustom(next); }, [value.patientMedicationId]);'
          new = '  useEffect(() => { const known = new Set([...PRESCRIBERS, ...INSTRUCTIONS, ...REASONS, ...FALLBACK_SIDE_EFFECTS, ...EFFECTIVENESS.map(([v]) => v)]); const next: Record<string, boolean> = {}; (["prescribedBy", "instructions", "indication", "sideEffects"] as const).forEach(key => { const current = String(value[key] || ""); if (current && !known.has(current)) next[key] = true; }); setCustom(next); }, [value.patientMedicationId, value.prescribedBy, value.instructions, value.indication, value.sideEffects]);'
          if old not in s:
              raise SystemExit('custom-field effect target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/medications/page.tsx
          git rm .github/workflows/fix-medication-edit-hydration.yml
          git commit -m 'Hydrate all saved medication fields when editing'
          git push origin HEAD:feat/multi-goal-clean

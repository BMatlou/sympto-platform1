name: Temporary medication route fix

on:
  push:
    branches:
      - feat/multi-goal-clean

permissions:
  contents: write

jobs:
  fix-route-is-known:
    if: contains(github.event.head_commit.message, '[apply-route-is-known-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-goal-clean
          fetch-depth: 0
      - name: Apply exact one-line fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app/medications/page.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const knownRoute = routeCandidates.length === 1 ? routeCandidates[0] : ""; const routeLabel = knownRoute ? formatRouteLabel(knownRoute) : "";'
          new = old + ' const routeIsKnown = Boolean(value.route?.trim() || knownRoute);'
          if 'const routeIsKnown =' in s:
              raise SystemExit('routeIsKnown already exists')
          if old not in s:
              raise SystemExit('Expected route declaration not found; refusing to change file')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/temporary-medication-route-fix.yml
          git add web/app/medications/page.tsx .github/workflows/temporary-medication-route-fix.yml
          git commit -m "Fix medication routeIsKnown runtime error"
          git push origin HEAD:feat/multi-goal-clean

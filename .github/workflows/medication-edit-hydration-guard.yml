name: Medication edit hydration guard
on:
  push:
    branches: [feat/multi-goal-clean]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-goal-clean
          fetch-depth: 0
      - name: Apply hydration gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('web/app/medications/page.tsx')
          s = p.read_text()
          old = '''  const { data, loading, error, reload } = useDashboard(); const [showEditor, setShowEditor] = useState(false); const [editing, setEditing] = useState(false); const [editingMedicationId, setEditingMedicationId] = useState<string | null>(null); const [editingMedicationData, setEditingMedicationData] = useState<any | null>(null); const [loadingEdit, setLoadingEdit] = useState(false); const [saving, setSaving] = useState(false);'''
          new = '''  const { data, loading, error, reload } = useDashboard(); const [showEditor, setShowEditor] = useState(false); const [editing, setEditing] = useState(false); const [editingMedicationId, setEditingMedicationId] = useState<string | null>(null); const [editingMedicationData, setEditingMedicationData] = useState<any | null>(null); const [loadingEdit, setLoadingEdit] = useState(false); const [isHydratingEdit, setIsHydratingEdit] = useState(false); const [saving, setSaving] = useState(false);'''
          if old not in s: raise SystemExit('state anchor not found')
          s = s.replace(old, new, 1)
          old = '''  async function openEdit(m: any) { const id = medicationId(m); if (!id) { toast.error("Unable to edit this medication."); return; } try { setLoadingEdit(true); const response = await api.get(`/patient-medications/${encodeURIComponent(String(id))}`); const payload: any = response.data; const record = payload?.data ?? payload; const complete = record?.patientMedication ?? record?.patient_medication ?? record; const merged = { ...m, ...record, ...(complete && typeof complete === "object" ? complete : {}), medication: complete?.medication ?? record?.medication ?? m?.medication }; const item = toItem(merged); if (!item) throw new Error("Saved medication record could not be mapped."); setEditingMedicationData(merged); setValues({ medications: [item] }); setEditing(true); setEditingMedicationId(String(id)); setMedicationStep(1); setShowEditor(true); } catch (e: any) { const msg = e?.response?.data?.message; toast.error(Array.isArray(msg) ? msg.join(", ") : msg || "Unable to load the saved medication details."); } finally { setLoadingEdit(false); } }'''
          new = '''  async function openEdit(medicationCard: any) { const targetId = medicationCard?.patientMedicationId || medicationCard?.id; if (!targetId) { toast.error("Unable to edit this medication."); return; } try { setIsHydratingEdit(true); setLoadingEdit(true); setShowEditor(true); const response = await api.get(`/patient-medications/${encodeURIComponent(String(targetId))}`); const payload: any = response.data; const record = payload?.data ?? payload; const complete = record?.patientMedication ?? record?.patient_medication ?? record; const merged = { ...medicationCard, ...record, ...(complete && typeof complete === "object" ? complete : {}), medication: complete?.medication ?? record?.medication ?? medicationCard?.medication }; const fullItem = toItem(merged); if (!fullItem?.patientMedicationId) throw new Error("Saved medication record could not be mapped."); setEditingMedicationData(merged); setValues({ medications: [fullItem] }); setEditing(true); setEditingMedicationId(String(fullItem.patientMedicationId)); setMedicationStep(1); } catch (e: any) { console.error("Error hydrating edit state:", e); setShowEditor(false); setEditing(false); setEditingMedicationId(null); setEditingMedicationData(null); const msg = e?.response?.data?.message; toast.error(Array.isArray(msg) ? msg.join(", ") : msg || "Unable to load the saved medication details."); } finally { setLoadingEdit(false); setIsHydratingEdit(false); } }'''
          if old not in s: raise SystemExit('openEdit anchor not found')
          s = s.replace(old, new, 1)
          old = '''{showEditor && <section ref={medicationFormRef} className="mb-8 scroll-mt-6 overflow-hidden rounded-[28px] border border-[#24c1c4]/15 bg-white shadow-2xl shadow-[#0b2d54]/10"><div className="bg-gradient-to-br from-[#0b2d54] via-[#103966] to-[#0b2d54] px-5 py-7 text-white sm:px-8">'''
          new = '''{showEditor && <section ref={medicationFormRef} className="mb-8 scroll-mt-6 overflow-hidden rounded-[28px] border border-[#24c1c4]/15 bg-white shadow-2xl shadow-[#0b2d54]/10"><div className="bg-gradient-to-br from-[#0b2d54] via-[#103966] to-[#0b2d54] px-5 py-7 text-white sm:px-8">'''
          if old not in s: raise SystemExit('modal start anchor not found')
          # Replace only the form wrapper, keeping the existing modal/card UI unchanged.
          old = '''</div><div className="px-5 py-7 sm:px-8 lg:px-12"><MedicationForm key={editingMedicationId ?? "new"} value={values.medications[0] || emptyMedication()} onChange={next => setValues({ medications: [next] })} existingMedicationIds={existingMedicationIds} existingMedicationNames={existingMedicationNames} onStepChange={setMedicationStep} initialMedicationReference={editingMedicationReference} editing={editing} /></div><div className="flex flex-col gap-3 border-t border-slate-100 bg-slate-50/70 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-8">'''
          new = '''</div><div className="px-5 py-7 sm:px-8 lg:px-12">{isHydratingEdit ? <div className="flex h-64 items-center justify-center" aria-live="polite"><span className="h-8 w-8 animate-spin rounded-full border-2 border-slate-200 border-t-[#24c1c4]" /><span className="ml-3 text-sm text-slate-500">Loading medication history...</span></div> : <MedicationForm key={editingMedicationId ?? "new"} value={values.medications[0] || emptyMedication()} onChange={next => setValues({ medications: [next] })} existingMedicationIds={existingMedicationIds} existingMedicationNames={existingMedicationNames} onStepChange={setMedicationStep} initialMedicationReference={editingMedicationReference} editing={editing} />}</div><div className="flex flex-col gap-3 border-t border-slate-100 bg-slate-50/70 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-8">'''
          if old not in s: raise SystemExit('form wrapper anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/app/medications/page.tsx
          git rm .github/workflows/medication-edit-hydration-guard.yml
          git commit -m 'Guard medication editor until edit hydration completes'
          git push origin HEAD:feat/multi-goal-clean

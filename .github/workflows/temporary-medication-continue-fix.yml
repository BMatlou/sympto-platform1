name: Temporary medication Continue fix
on:
  push:
    branches: [feat/multi-goal-clean]
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-goal-clean
          fetch-depth: 0
      - name: Apply safe app fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Keep the existing medication route fix idempotent.
          p = Path('web/app/medications/page.tsx')
          s = p.read_text()
          old = 'const knownRoute = routeCandidates.length === 1 ? routeCandidates[0] : ""; const routeLabel = knownRoute ? formatRouteLabel(knownRoute) : ""; const routeIsKnown = Boolean(value.route?.trim() || knownRoute);'
          new = '''const knownRoute = routeCandidates.length === 1 ? routeCandidates[0] : ""; const routeLabel = knownRoute ? formatRouteLabel(knownRoute) : ""; const routeIsKnown = Boolean(value.route?.trim() || knownRoute);\n  useEffect(() => { if (!value.route?.trim() && knownRoute) set("route", knownRoute); }, [knownRoute, value.route]);'''
          if old in s:
              s = s.replace(old, new, 1)
          old2 = 'const canNext = step === 1 ? Boolean(value.medicationId && value.dosage && value.frequency && value.route) : step === 2 ? Boolean(value.indication && value.instructions && value.startedAt) : true;'
          new2 = 'const canNext = step === 1 ? Boolean(value.medicationId && value.dosage && value.frequency && (value.route || knownRoute)) : step === 2 ? Boolean(value.indication && value.instructions && value.startedAt) : true;'
          if old2 in s:
              s = s.replace(old2, new2, 1)
          p.write_text(s)

          # Preserve the immutable weight baseline and repair metric-config insertion.
          backend = Path('api/src/modules/health-goals/health-goals.service.ts')
          s = backend.read_text()
          old_baseline = '''    await this.prisma.$executeRaw`DELETE FROM "HealthGoalMetricEvent" WHERE "patientId" = ${patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" = 'goal-baseline' AND "sourceId" = ${goalId}`;
    await this.prisma.$executeRaw`INSERT INTO "HealthGoalMetricEvent" ("id","patientId","metricType","metricKey","loggedValue","occurredAt","source","sourceId") VALUES (gen_random_uuid(),${patientId},'WEIGHT','weight.kg',${baseline},${createdAt},'goal-baseline',${goalId})`;'''
          new_baseline = '''    const existingBaseline = await this.prisma.$queryRaw<Array<{ id: string }>>`SELECT "id" FROM "HealthGoalMetricEvent" WHERE "patientId" = ${patientId} AND "metricType" = 'WEIGHT' AND "metricKey" = 'weight.kg' AND "source" = 'goal-baseline' AND "sourceId" = ${goalId} LIMIT 1`;
    if (existingBaseline.length) return;
    await this.prisma.$executeRaw`INSERT INTO "HealthGoalMetricEvent" ("id","patientId","metricType","metricKey","loggedValue","occurredAt","source","sourceId") VALUES (gen_random_uuid(),${patientId},'WEIGHT','weight.kg',${baseline},${createdAt},'goal-baseline',${goalId})`;'''
          if old_baseline in s:
              s = s.replace(old_baseline, new_baseline, 1)
          old_insert = '''VALUES (gen_random_uuid(), ${goalId}, ${config.metricType ?? null}, ${config.metricKey ?? null}, ${config.frequency ?? null}, ${config.aggregation ?? null}, ${config.comparison ?? null}, ${config.guidanceText ?? null})`;'''
          new_insert = '''VALUES (gen_random_uuid(), ${goalId}, ${config.metricType ?? null}, ${config.metricKey ?? null}, ${config.frequency ?? null}, ${config.frequencyTarget ?? null}, ${config.aggregation ?? null}, ${config.comparison ?? null}, ${config.guidanceText ?? null})`;'''
          if old_insert in s:
              s = s.replace(old_insert, new_insert, 1)
          backend.write_text(s)

          # BMI guidance is advisory; never block saving a user goal.
          frontend = Path('web/app/health-goals/page.tsx')
          s = frontend.read_text()
          old_guard = '''      if (draft.weightDirection === "LOSE" && (analysis.underweightNow || analysis.targetBelowHealthy)) {
        toast.error("This weight-loss target would move you below the adult BMI screening range. Choose a smaller target or a health-focused goal, and consider discussing your weight goal with a healthcare professional.");
        return;
      }'''
          new_guard = '''      if (draft.weightDirection === "LOSE" && (analysis.underweightNow || analysis.targetBelowHealthy)) {
        toast.warning("Weight goal saved. This target is below the standard adult BMI healthy screening range; review the goal with a healthcare professional.");
      }'''
          if old_guard in s:
              s = s.replace(old_guard, new_guard, 1)
          import re
          s, _ = re.subn(r'\n\s*\|\|\s*\(draft\.category === "WEIGHT"\s*&&\s*!!advisor\?\.targetBelowHealthy\s*&&\s*draft\.weightDirection === "LOSE"\)', '', s, count=1)
          frontend.write_text(s)

          # Remove the temporary patch workflow and trigger file after the real changes are committed.
          Path('.github/workflows/fix-weight-goal-nonblocking.yml').unlink(missing_ok=True)
          Path('fix-weight-goal-trigger.txt').unlink(missing_ok=True)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/modules/health-goals/health-goals.service.ts web/app/health-goals/page.tsx web/app/medications/page.tsx .github/workflows/fix-weight-goal-nonblocking.yml fix-weight-goal-trigger.txt
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve weight baselines and keep BMI advice non-blocking"
          git push origin feat/multi-goal-clean
